<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Tab Organizer</h1>
      <p class="subtitle">Group tabs automatically by domain.</p>
    </header>

    <main>
      <div id="status-banner" class="banner hidden"></div>

      <section class="add-rule">
        <h2 id="form-title">Add a group</h2>
        <form id="rule-form">
          <input type="hidden" id="rule-id" />

          <label for="group-name">Group name</label>
          <input
            type="text"
            id="group-name"
            placeholder="e.g. Social"
            autocomplete="off"
            required
          />

          <label id="group-color-label">Color</label>
          <div id="color-dropdown" class="color-dropdown">
            <button
              type="button"
              id="color-trigger"
              class="color-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-labelledby="group-color-label"
            >
              <span id="color-trigger-dot" class="color-dot"></span>
              <span id="color-trigger-label" class="color-trigger-label"></span>
              <span class="color-trigger-caret" aria-hidden="true">▾</span>
            </button>
            <div
              id="group-color"
              class="color-grid hidden"
              role="radiogroup"
              aria-labelledby="group-color-label"
            ></div>
          </div>

          <label for="group-domains">Domains</label>
          <textarea
            id="group-domains"
            rows="3"
            placeholder="facebook.com, instagram.com&#10;twitter.com"
          ></textarea>
          <small class="hint">
            One or more domains, separated by commas or new lines. Subdomains are
            matched automatically (facebook.com also matches m.facebook.com).
          </small>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="primary">Save group</button>
            <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
          </div>
          <p id="form-error" class="error hidden"></p>
        </form>
      </section>

      <section class="rules">
        <h2>Your groups</h2>
        <ul id="rules-list"></ul>
        <p id="empty-state" class="empty hidden">No groups yet. Add one above.</p>
        <button type="button" id="organize-btn" class="secondary full-width">
          Organize open tabs now
        </button>
        <p id="organize-result" class="result hidden"></p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
